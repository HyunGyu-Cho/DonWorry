name: backend
on:
  push:
    branches: [main, dev]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:                # PR은 항상 실행 — 필수 검사가 '대기 중'으로 멈추지 않게

jobs:
  backend:
    name: backend   # 필수 검사 이름 — 세 개가 겹치지 않게
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew      # Windows에서 커밋해도 실행 권한 문제 없게
      - run: ./gradlew check       # 컴파일 + ModularityTests
