name: ai-server
on:
  push:
    branches: [main]
    paths: ['ai-server/**', '.github/workflows/ai-server.yml']
  pull_request:
    paths: ['ai-server/**', '.github/workflows/ai-server.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install uv
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest
