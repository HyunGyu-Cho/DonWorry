plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.donworry'
version = '0.0.1-SNAPSHOT'
description = 'DonWorry 백엔드 — 결제(PG)·FDS·보안조사·정산'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    springModulithVersion = '2.1.1'
}

dependencies {
    // 웹·검증
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 영속성 — 스키마 정본은 Flyway (DEC: 스키마 수동 변경 금지)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Spring Boot 4 에서는 Flyway 자동 구성이 별도 모듈로 분리되었다.
    // flyway-core 만 넣으면 마이그레이션이 조용히 실행되지 않으므로 스타터가 필요하다.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'      // MariaDB/MySQL 계열 지원 모듈
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    // 인증·권한 (AUTH-01, DEC-13 역할·가맹점 격리)
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // 모듈 경계 + Event Publication Registry (C05 CaseDecisionMade 영속 발행)
    // JPA 대신 JDBC 구현을 쓴다: event_publication 이 JPA 엔티티가 아니게 되므로
    // ddl-auto=validate 를 켜도 이 인프라 테이블이 검사 대상에서 빠진다 (06-1 정책).
    implementation "org.springframework.modulith:spring-modulith-starter-core"
    implementation "org.springframework.modulith:spring-modulith-starter-jdbc"

    // 운영 확인용
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation "org.springframework.modulith:spring-modulith-starter-test"
    // 06-3: Modulith 와 겹치지 않는 구조 규칙(Controller → Repository 금지 등)
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
    }
}

// 기본 test 는 DB 없이 어디서나 돌아야 한다. 실제 MariaDB 가 필요한 테스트는
// @Tag("db") 로 떼어내고 dbTest 태스크에서만 실행한다 (06-3 점진적 도입).
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'db'
    }
}

tasks.register('dbTest', Test) {
    group = 'verification'
    description = '빈 MariaDB 에 Flyway 전체 migration 적용 + JPA validate 검증'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'db'
    }
    // 접속 정보는 환경변수로 받는다 (CI 의 MariaDB service, 로컬의 임시 인스턴스).
    // 환경변수가 없으면 application.yml 기본값을 그대로 쓴다.
    [
        'spring.datasource.url'     : 'DONWORRY_TEST_DB_URL',
        'spring.datasource.username': 'DONWORRY_TEST_DB_USER',
        'spring.datasource.password': 'DONWORRY_TEST_DB_PASSWORD',
    ].each { property, envName ->
        def value = System.getenv(envName)
        if (value != null) {
            systemProperty property, value
        }
    }
    outputs.upToDateWhen { false }
}
