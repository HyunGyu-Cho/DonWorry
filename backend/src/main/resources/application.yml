spring:
  application:
    name: donworry

  # 내 PC 설정 backend/.env가 있으면 읽는다 (없어도 됨, git 제외) — 예시는 backend/.env.example (#84)
  # .env의 DONWORRY_* 줄이 아래 ${DONWORRY_...:기본값} 자리를 채운다. 실제 환경 변수가 있으면 그쪽이 우선
  # 테스트는 donworry.env-file을 없는 파일로 바꿔 내 PC 설정을 읽지 않는다 (build.gradle)
  config:
    import: optional:file:${donworry.env-file:.env}[.properties]

  datasource:
    url: jdbc:mariadb://${DONWORRY_DB_HOST:localhost}:${DONWORRY_DB_PORT:3307}/${DONWORRY_DB_NAME:donworry}
    username: ${DONWORRY_DB_USER:donworry}
    password: ${DONWORRY_DB_PASSWORD:donworry}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate            # 테이블은 Flyway만 만든다. Entity와 스키마가 어긋나면 기동 실패
    properties:
      hibernate:
        jdbc:
          time_zone: UTC            # ERD 공통 규칙: DATETIME(6)에 UTC 저장

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true       # 이미 적용된 파일이 바뀌면 기동 실패
    clean-disabled: true            # flyway clean으로 DB가 통째로 지워지는 것을 막는다
    # 파일명 타임스탬프는 '만든 시각'이라 병합 순서와 다를 수 있다
    # 늦게 병합된 낮은 버전도 적용되게 허용한다 (의존 순서까지 보장하지는 않음)
    out-of-order: true

  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false            # EVENT_PUBLICATION 테이블은 Flyway migration이 만든다

server:
  port: ${DONWORRY_PORT:8081}       # CakeShop 8080과 겹치지 않게
  servlet:
    session:
      timeout: 30m                 # 비활동 만료 (ADR-0014)
      cookie:
        http-only: true
        same-site: lax

fds:
  mock:
    # P5 요청이 아직 없는 로컬 화면용 Mock. P5 실연동 환경에서는 false로 끈다.
    seed-enabled: ${FDS_MOCK_SEED_ENABLED:true}

donworry:
  demo:
    # 모의 카드사가 승인 취소 · 매입을 처리하는 시간 (#82). 그동안 사건은 "조치 진행 중" — 시연용, 테스트는 0초
    card-company-delay: ${DONWORRY_CARD_COMPANY_DELAY:PT5S}
    # 테스트 상점 "접속 환경"(X-Demo-Client-IP · X-Demo-Device-Id 헤더)을 믿을지 (#98). 운영은 false — 아무나 IP · 기기를 꾸밀 수 있다
    # 켜도 IP는 demo_fake_ips 이름표에 있는 값만 받는다
    fake-client-ip: ${DONWORRY_DEMO_FAKE_CLIENT_IP:false}
  report:
    # 보고서 내용을 채우는 쪽. fake = Spring 안의 템플릿으로 바로 완료, ai-server = ai-server에 조사를 맡김
    # 결과 받기(2-17) 전에는 ai-server로 바꾸면 보고서가 "생성 중"에서 멈춘다
    writer: ${DONWORRY_REPORT_WRITER:fake}
    # 시도를 시작하고 이 시간 안에 결과가 없으면 ai-server에 직접 묻고, 그래도 없으면 시도 실패 (#68 · #88)
    result-timeout: ${DONWORRY_REPORT_RESULT_TIMEOUT:PT2M}
  ai-server:
    base-url: ${DONWORRY_AI_SERVER_URL:http://localhost:8000}
    # ai-server의 AI_SERVER_SERVICE_KEY와 같은 값. 저장소에 올리지 않고 환경 변수로만 넣는다
    service-key: ${DONWORRY_AI_SERVER_SERVICE_KEY:}
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
